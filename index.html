<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ruang SDM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0f172a;
    --bg2:#1e293b;
    --text:#ffffff;
    --accent:#38bdf8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,var(--bg),var(--bg2));
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

/* Background Glow */
.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.25;
}

.glow1{
    width:220px;
    height:220px;
    background:#38bdf8;
    top:-60px;
    left:-60px;
}

.glow2{
    width:260px;
    height:260px;
    background:#6366f1;
    bottom:-80px;
    right:-80px;
}

/* Content */
.container{
    text-align:center;
    padding:24px;
    width:100%;
    max-width:500px;
    z-index:10;
}

.logo{
    width:72px;
    height:72px;
    margin:0 auto 24px;
    border-radius:20px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    animation:float 4s ease-in-out infinite;
}

h1{
    color:var(--text);
    font-size:2.8rem;
    font-weight:700;
    margin-bottom:10px;
    letter-spacing:1px;
}

.coming{
    color:rgba(255,255,255,.8);
    font-size:.95rem;
    letter-spacing:6px;
    text-transform:uppercase;
    font-weight:300;
}

/* Mobile */
@media(max-width:600px){

    h1{
        font-size:2.2rem;
    }

    .coming{
        font-size:.85rem;
        letter-spacing:4px;
    }

    .logo{
        width:64px;
        height:64px;
        font-size:28px;
    }
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

</style>
</head>

<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="container">

    <div class="logo">🎓</div>

    <h1>Ruang SDM</h1>

    <div class="coming">
        Coming Soon
    </div>

</div>

</body>
</html>
